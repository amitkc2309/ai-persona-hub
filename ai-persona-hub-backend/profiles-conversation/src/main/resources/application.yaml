server:
  port: 8081
spring:
  application:
    name: profiles-conversation
  data:
    mongodb:
      database: ai-persona-mongo
      host: localhost
      port: 27017

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://${machine_url}:7080/realms/ai-persona-hub/protocol/openid-connect/certs"

  #Ollama
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    ollama:
      base-url: http://${machine_url}:11434

keycloak_url: http://${machine_url}:7080

machine_url: localhost

image:
  dir: /generated-images
stability:
  ai: http://${machine_url}:7860/sdapi/v1/txt2img
  quality: 30 # Higher value is good. Up to 50

#Custom application properties
application:
  default-ai-provider: OLLAMA
  models:
    openai:
      - gpt-5
      - gpt-5-mini
    ollama:
      - llama3.1

logging:
  level:
    root: ERROR
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
        data:
          mongodb: ERROR
        boot: INFO

#Actuator with readiness and liveness
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true