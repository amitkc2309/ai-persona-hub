server:
  port: 8080
spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      httpclient:
        connect-timeout: 1000
        response-timeout: 20s

      default-filters:
        - SaveSession #instruct Spring Cloud Gateway to always save the web session before forwarding requests downstream.
#        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
#        - AddResponseHeader=Access-Control-Allow-Origin, *

      routes:
        - id: profiles-conversation
          uri: ${back_end.url}
          predicates:
            - Path=/profiles/**, /conversation/**, /api/**
          filters:
            - TokenRelay
          metadata:
            response-timeout: -1
        - id: frontend
          uri: ${front_end.url}
          predicates:
            - Path=/**

  # connect to redis
  data:
    redis:
      connect-timeout: 2s
      host: ${machine_url}
      port: 6379
      timeout: 1s

  # Use redis for session management
  session:
    redis:
      namespace: api-persona-gateway
      repository-type: default
    timeout: 10m

  #OAuth2 Client setup
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ai-persona-hub-auth-code-grant
            client-secret: TlLtZyrPPmoLIGcXEjfbyBd1gQDDYd3o
            scope: openid,email,profile,roles
            authorization-grant-type: authorization_code
#            redirect-uri: "${machine_url}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: "http://${machine_url}:7080/realms/ai-persona-hub"

#frontEnd
front_end:
  url: http://${machine_url}:5173

back_end:
  url: http://${machine_url}:8081

machine_url: localhost

#Actuator with readiness and liveness
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      enabled: true

logging:
  level:
    root: ERROR
    org:
      springframework:
        security: ERROR
        boot: INFO